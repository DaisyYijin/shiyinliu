<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾音流 · 抖音 → 喜马拉雅</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e6e9ef; --dim:#8b93a3; --acc:#4f8cff; --ok:#3fb96f; --bad:#e0563a; --warn:#e0a23a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h3 { margin:0 0 10px; font-size:14px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:90px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--dim); font-size:12px; }
  .bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  button { background:var(--acc); border:0; color:#fff; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  input[type=text] { background:#11141b; border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:8px 12px; font-size:13px; flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; background:#141821; white-space:nowrap; }
  td.title { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; }
  .b-uploaded{background:rgba(63,185,111,.15);color:var(--ok);} .b-failed{background:rgba(224,86,58,.15);color:var(--bad);}
  .b-pending{background:rgba(224,162,58,.15);color:var(--warn);} .b-run{background:rgba(79,140,255,.15);color:var(--acc);}
  .err { color:var(--bad); font-size:12px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:middle; }
  #msg { margin:0 0 12px; color:var(--dim); font-size:12px; min-height:18px; }
  a { color:var(--acc); text-decoration:none; }
  .login-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .login-state { font-size:12px; color:var(--dim); }
  .login-state.ok { color:var(--ok); }
  #qr { margin-top:10px; max-width:260px; width:100%; border:1px solid var(--line); border-radius:8px; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>拾音流</h1>
  <div class="sub">抖音视频 → 音频 → 喜马拉雅 · 自动监控处理</div>
  <div class="stats" id="stats"></div>
  <div id="msg"></div>
  <div class="grid">
    <div class="card">
      <h3>手动提交链接（视频 / 博主主页，支持分享短链）</h3>
      <div class="bar" style="margin-bottom:0">
        <input type="text" id="url" placeholder="粘贴抖音视频链接、分享口令或主页链接…">
        <button id="submit">提交处理</button>
      </div>
    </div>
    <div class="card">
      <h3>喜马拉雅登录</h3>
      <div class="login-row">
        <button class="ghost" id="login">扫码登录</button>
        <span class="login-state" id="login-state">未检测</span>
      </div>
      <img id="qr" alt="登录二维码">
    </div>
  </div>
  <div class="bar" style="margin-top:16px">
    <button id="poll">立即轮询</button>
    <button class="ghost" id="refresh">刷新</button>
  </div>
  <table>
    <thead><tr><th>状态</th><th>标题</th><th>账号</th><th>重试</th><th>错误</th><th>更新时间</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" style="color:var(--dim)">加载中…</td></tr></tbody>
  </table>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = t => t ? new Date(t*1000).toLocaleString("zh-CN",{hour12:false}) : "-";
const esc = s => (s||"").replace(/"/g,"&quot;");
const badge = s => {
  const cls = s==="uploaded"?"b-uploaded":s==="failed"?"b-failed":
    (["discovered","downloaded","converted"].includes(s)?"b-pending":"b-run");
  return `<span class="badge ${cls}">${s}</span>`;
};
function render(data){
  const st = data.stats||{};
  const pend = (st.discovered||0)+(st.downloaded||0)+(st.converted||0);
  const total = Object.values(st).reduce((a,b)=>a+b,0);
  $("stats").innerHTML = [["全部",total],["已上传",st.uploaded||0],["待处理",pend],["失败",st.failed||0]]
    .map(([n,v])=>`<div class="stat"><b>${v}</b><span>${n}</span></div>`).join("");
  const rows = (data.records||[]).map(r=>`<tr>
    <td>${badge(r.status)}</td>
    <td class="title" title="${esc(r.title)}">${r.title||r.aweme_id}</td>
    <td>${r.account||""}</td><td>${r.attempts||0}</td>
    <td>${r.error?`<span class="err" title="${esc(r.error)}">${r.error}</span>`:""}</td>
    <td>${fmt(r.updated_at)}</td></tr>`).join("");
  $("rows").innerHTML = rows || `<tr><td colspan="6" style="color:var(--dim)">暂无记录，等待首次轮询…</td></tr>`;
}
async function load(){ try{ render(await (await fetch("/api/records")).json()); }catch(e){ $("msg").textContent=""+e; } }

async function pollLogin(){
  try{
    const s = await (await fetch("/api/login/status")).json();
    const el = $("login-state");
    if (s.logged_in){ el.textContent="已登录 ✓"; el.className="login-state ok"; $("qr").style.display="none"; }
    else if (s.running){ el.textContent=s.message||"等待扫码…"; }
    else { el.textContent="未登录"; el.className="login-state"; }
    if (s.running && s.qr){ $("qr").src=s.qr+"?t="+Date.now(); $("qr").style.display="block"; }
    else if (!s.logged_in) { $("qr").style.display="none"; }
  }catch(e){}
}
$("login").onclick = async () => {
  $("login").disabled = true;
  try {
    const r = await fetch("/api/login/start",{method:"POST"});
    $("msg").textContent = "登录任务已发起，下方二维码出现后用喜马拉雅 App 扫码（约 5 分钟内有效）";
    pollLogin();
  } catch(e){ $("msg").textContent="发起失败："+e; }
  finally { $("login").disabled = false; }
};
$("submit").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return;
  $("submit").disabled = true; $("msg").textContent = "已提交，处理中…";
  try {
    const r = await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const j = await r.json().catch(()=>({detail:"未知错误"}));
    $("msg").textContent = r.ok ? ("完成：" + JSON.stringify(j)) : ("失败：" + JSON.stringify(j.detail||j));
    load();
  } catch(e){ $("msg").textContent="失败："+e; }
  finally { $("submit").disabled = false; }
};
$("poll").onclick = async () => {
  $("poll").disabled = true; $("msg").textContent = "轮询中，可能需要几分钟…";
  try { const r = await (await fetch("/api/poll",{method:"POST"})).json(); $("msg").textContent = "完成：" + JSON.stringify(r); load(); }
  catch(e){ $("msg").textContent = "失败：" + e; }
  finally { $("poll").disabled = false; }
};
$("refresh").onclick = load;
load(); pollLogin();
setInterval(load, 15000);
setInterval(pollLogin, 8000);
</script>
</body>
</html>

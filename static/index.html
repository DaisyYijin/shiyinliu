<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾音流 · 抖音 → 喜马拉雅</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e6e9ef; --dim:#8b93a3; --acc:#4f8cff; --ok:#3fb96f; --bad:#e0563a; --warn:#e0a23a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h3 { margin:0 0 10px; font-size:14px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:90px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--dim); font-size:12px; }
  .bar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  button { background:var(--acc); border:0; color:#fff; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.mini { padding:3px 10px; font-size:12px; border-radius:6px; }
  button.danger { background:transparent; border:1px solid rgba(224,86,58,.5); color:var(--bad); }
  input[type=text] { background:#11141b; border:1px solid var(--line); color:var(--fg); border-radius:8px; padding:8px 12px; font-size:13px; flex:1; min-width:140px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--dim); font-weight:500; background:#141821; white-space:nowrap; }
  td.title { max-width:340px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; }
  .b-uploaded{background:rgba(63,185,111,.15);color:var(--ok);} .b-failed{background:rgba(224,86,58,.15);color:var(--bad);}
  .b-pending{background:rgba(224,162,58,.15);color:var(--warn);} .b-run{background:rgba(79,140,255,.15);color:var(--acc);}
  .b-src{background:rgba(139,147,163,.15);color:var(--dim);}
  .err { color:var(--bad); font-size:12px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:middle; }
  #msg { margin:0 0 12px; color:var(--dim); font-size:12px; min-height:18px; }
  a { color:var(--acc); text-decoration:none; }
  .login-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .login-state { font-size:12px; color:var(--dim); }
  .login-state.ok { color:var(--ok); }
  .qr { margin-top:10px; max-width:220px; width:100%; border:1px solid var(--line); border-radius:8px; display:none; }
  .acct-list { margin-top:10px; max-height:260px; overflow-y:auto; }
  .acct-row { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .acct-row:last-child { border-bottom:0; }
  .acct-row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>拾音流</h1>
  <div class="sub">抖音视频 → 音频 → 喜马拉雅 · 自动监控处理</div>
  <div class="stats" id="stats"></div>
  <div id="msg"></div>
  <div class="grid">
    <div class="card">
      <h3>监控博主（搜索添加 / 全量拉取）</h3>
      <div class="bar" style="margin-bottom:8px">
        <input type="text" id="kw" placeholder="输入博主昵称，先完成抖音扫码登录…">
        <button id="search">搜索</button>
      </div>
      <div id="results" class="acct-list" style="display:none"></div>
      <div id="acct-list" class="acct-list"></div>
      <div class="hint">新添加的博主首轮会拉取全部作品并逐条转音频上传，之后自动增量。</div>
    </div>
    <div class="card">
      <h3>手动提交链接（视频 / 主页，支持分享短链）</h3>
      <div class="bar" style="margin-bottom:0">
        <input type="text" id="url" placeholder="粘贴抖音视频链接或分享口令…">
        <button id="submit">提交处理</button>
      </div>
    </div>
    <div class="card">
      <h3>抖音登录（搜索与提额用）</h3>
      <div class="login-row">
        <button class="ghost" id="dy-login">扫码登录</button>
        <span class="login-state" id="dy-state">未检测</span>
      </div>
      <div class="login-row" id="dy-verify" style="display:none;margin-top:8px">
        <input type="text" id="dy-code" placeholder="输入短信验证码 / 手机尾号…">
        <button class="mini" id="dy-code-submit">提交验证</button>
      </div>
      <img id="dy-qr" class="qr" alt="抖音登录二维码">
    </div>
    <div class="card">
      <h3>喜马拉雅登录（上传用）</h3>
      <div class="login-row">
        <button class="ghost" id="xm-login">扫码登录</button>
        <span class="login-state" id="xm-state">未检测</span>
      </div>
      <img id="xm-qr" class="qr" alt="喜马拉雅登录二维码">
    </div>
  </div>
  <div class="bar" style="margin-top:16px">
    <button id="poll">立即轮询</button>
    <button class="ghost" id="refresh">刷新</button>
  </div>
  <table>
    <thead><tr><th>状态</th><th>标题</th><th>账号</th><th>重试</th><th>错误</th><th>更新时间</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" style="color:var(--dim)">加载中…</td></tr></tbody>
  </table>
</div>
<script src="/app.js"></script>
</body>
</html>

services:
  shiyinliu:
    # GitHub Actions 自动构建并推送（main 分支触发），直接拉取即可
    image: ghcr.io/daisyyijin/shiyinliu:latest
    # 如需本地构建：注释掉上面的 image，取消下面两行注释
    # build: .
    # image: shiyinliu:local
    container_name: shiyinliu
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./config:/app/config    # app.yaml 配置
      - ./data:/app/data        # 状态库 / 登录态 / 排查截图
      - ./media:/app/media      # 产出音频归档
